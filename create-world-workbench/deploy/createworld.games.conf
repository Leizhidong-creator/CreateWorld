# Public frontend only; the local generation workbench is not exposed.
server {
    listen 80;
    listen [::]:80;
    server_name createworld.games www.createworld.games;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://createworld.games$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.createworld.games;
    ssl_certificate /etc/letsencrypt/live/createworld.games/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/createworld.games/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://createworld.games$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name createworld.games;
    ssl_certificate /etc/letsencrypt/live/createworld.games/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/createworld.games/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/createworld-current;
    index index.html;
    charset utf-8;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    add_header Cache-Control no-cache always;
    location = /api/projects {
        if ($request_method !~ ^(GET|HEAD)$) { return 503 '{"error":"当前为前端体验站，云端项目创建尚未开放。"}'; }
        default_type application/json;
        return 200 '[]';
    }
    location = /api/bootstrap {
        default_type application/json;
        return 200 '{"csrfToken":"","capabilities":{},"projects":[]}';
    }
    location ^~ /api/ {
        default_type application/json;
        return 503 '{"error":"当前为前端体验站，云端创作服务尚未接入。"}';
    }
    location ~ /\. { deny all; }
    location ~* \.map$ { return 404; }
    location /assets/ { try_files $uri =404; }
    location /worlds/ { try_files $uri =404; }
    location /demo-assets/ { try_files $uri =404; }
    location /local-games/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
