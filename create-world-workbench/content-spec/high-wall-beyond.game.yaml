      - 摇杆/方向输入前进转向
      - 松开逐步减速
      - 退出继续、重开、加速完成
    规则:
      - 有加速、惯性与减速
      - 撞障碍停止对应速度，可调整继续
      - 车辆实际进入出口才完成
      - 无计时、燃油、排名、追捕、载客或碰撞失败
    反馈:
      - 车身朝向与运动清楚
      - 碰撞停止可见
      - 速度改变引擎声
      - 到达短声并停引擎
    成功: 到达出口或加速完成后回F08。
    失败: 无一般玩法失败。
    无效尝试: 碰墙不死亡、不扣生命。
