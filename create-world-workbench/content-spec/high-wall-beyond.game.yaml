    失败: 被接触时正在撒土：确认回CP_SOIL，仍带土但次数0。
    无效尝试: 普通带土走过看守不失败，区外长按无效。
    退出继续: 松开或离开保留完整次数；暂停冻结巡查。
    重开: 失败后恢复携土土洞阶段，不重做交易或重挖。
    跳过: 不适用。
    教学: 首次进入土地先说明区域、长按、中断避让；首次实际完成一轮记实操。
    参数:
      剧情固定:
        - 分次、警戒、中断避让
      难度可调:
        次数: 3
        每次秒: 5
        警戒秒: 3
        速度: 须留中断避让机会
    声音引用:
      - A03
    来源:
      依据:
        - SRC_PACK
        - SRC_USER
      定位: M13
      设计引用: []
  - id: K_PIPE
    名称: 雷电砸管
    类别: 主场景局部挑战
    入口事件引用:
      - M24
    目标: 在雷电窗口中完成多次砸击
    初始局面:
      内容: 未破管，计数0，雨与周期雷电。
    操作:
      - 到工作点等待
      - 窗口内新按住
      - 持续完成一次后释放等下次
    规则:
      - 窗外新按下立即噪声失败
      - 窗内开始但窗口结束前未蓄满，只清本击，不失败
      - 同窗口最多计一次
      - 按住跨窗口不自动新开一击
      - 共5次，3次后裂纹明显
    反馈:
      - 窗口/当前蓄力/次数可见
      - 雷声与闪电同步
      - 裂纹到破口
    成功: 管打开后可移动进入。
    失败: 窗外新发起砸击：确认回CP_ESCAPE，重置管道局部。
    无效尝试: 提前松开或窗口到期取消本击；须释放再开始。
    退出继续: 暂停冻结窗口；正常撤离未完成长按清零，保留已完整次数至失败；继续游戏从CP_PIPE开始。
    重开: 失败后本轮次数0、管封闭；保留地图账本等。
    跳过: 不适用。
    教学: 进入先说明雷电信号，实际在窗口完成一击才记实操；不要把看过说明当完成。
    参数:
      剧情固定:
        - 雷电掩护才能发起
      难度可调:
        成功次数: 5
        裂纹阈值: 3
        窗口及蓄力: 完整窗口必须长于一次蓄力，周期不过分等待
    声音引用:
      - A07
    来源:
      依据:
        - SRC_PACK
        - SRC_USER
      定位: M24
      设计引用: []
  - id: K_CRAWL
    名称: 管中方向与出口
    类别: 主场景局部挑战
    入口事件引用:
      - M25
    目标: 爬向通往外界的一端
    初始局面:
      内容: 穿破口下落入管道；出口与危险端可分辨。
    操作:
      - 沿管道左右或对应方向移动
    规则:
      - 正确端越界成功
      - 反向越危险边界坠水失败
      - 无氧气、敌人或钥匙
    反馈:
      - 狭窄爬行动作
      - 危险端在越界前可见警示
    成功: 爬出到M26。
    失败: 坠水：确认回CP_ESCAPE，重置砸管及爬行。
    无效尝试: 碰管壁仅阻挡。
    退出继续: 暂停冻结；主线恢复采用管道检查点。
    重开: 失败从海报重新进入最终隧道并砸管。
    跳过: 不适用。
    教学: 进入提示沿外界方向，危险端给可读警示。
    参数:
      剧情固定:
        - 出口与坠水两端
      难度可调:
        - 通道长度与爬速
    声音引用:
      - A07
    来源:
      依据:
        - SRC_PACK
        - SRC_USER
      定位: M25
      设计引用: []
  - id: K_HIDE
    名称: 早入办公室躲藏
    类别: 主场景局部挑战
    入口事件引用:
      - E12
    目标: 查房预警时藏入窗帘并等待离场
    初始局面:
      内容: 首次警告后、图纸前的空办公室；每次进入抽一次是否查房。
    操作:
      - 自由移动查看或从门退出
      - 预警后靠近窗帘并交互
      - 藏好等待来人离开
    规则:
      - 每次进入约40%查房，若选中延迟8—15秒
      - 脚步预警后5秒藏身
      - 单站窗帘附近不算躲好
      - 来人看守或幕后主使进屋巡查后离开
      - 地图主线开启后不再抽查房
    反馈:
      - 脚步+倒计时
      - 藏好状态与来人离开可见
    成功: 恢复空室探索；不奖主线物件。
    失败: 未按时藏好被看见，确认回CP_OFFICE，不损主线与收藏。
    无效尝试: 远距离交互不传送入帘。
    退出继续: 预警前可离开；暂停冻结；预警/隐藏时禁止物证及闲聊覆盖。
    重开: 失败回门外，下一次入室重新抽一次。
    跳过: 不适用。
    教学: 首次预警明确说明必须靠近再交互，倒计时须足以到达。
    参数:
      剧情固定:
        - 藏身才安全，不开新路线
      难度可调:
        查房概率: 0.4
        延迟秒:
          - 8
          - 15
        躲藏秒: 5
    声音引用:
      - A05
    来源:
      依据:
        - SRC_PACK
        - SRC_USER
      定位: E12
      设计引用:
        - D10
