        - SRC_PACK
        - SRC_USER
      定位: F02|F03
      设计引用:
        - D01
        - D02
        - D03
  - id: G05
    名称: 驾驶赴约
    类别: 独立小游戏
    入口事件引用:
      - F07
    目标: 沿道路驶入边境出口
    初始局面:
      局面类型: 固定
      内容: 可行道路连接起点与出口，边界和障碍有碰撞。车辆初始静止。
    操作:
