行为记录:
  责任边界: 游戏描述实际发生的事实，外部系统承担风格分类、权重和阈值。本文件不定义算法，也不保证某个行为一定得到某张卡。
  项目:
    - id: B01
      名称: 主线经历
      内容: 实际完成的事件ID、时代和完成顺序
      记录时机: 完成判定成立
      去重: 本轮每个一次，重播不加入
    - id: B02
      名称: 探索发现
      内容: COL01—COL08及对应信息，是否获得两份原件
      记录时机: 实际交谈或听清
      去重: 本轮每项一次
    - id: B03
      名称: 普通交流回顾
      内容: 实际听到的E08a—j与E10
      记录时机: 近处听到完整语义或完成主动交谈
      去重: 同项一次；不把未在场广播记已听
    - id: B04
      名称: 小游戏结果
      内容: G01—G05完成方式manual或skip、是否实际教学、主动重开次数与明确失败次数
      记录时机: 真实发生时
      去重: 每局尝试独立；成功回接一次；重播不计本轮
    - id: B05
      名称: 挑战行为
      内容: 撒土完整次数与中断、砸管成功/无效/失败、早入办公室与隐藏结果
      记录时机: 动作判定后
      去重: 实际尝试，不将暂停恢复当新一次
    - id: B06
      名称: 外观与地图
      内容: 海报选择与本轮实际揭雾范围
      记录时机: 选择确定、区域首次探索
      去重: 本轮唯一或集合
  结果展示:
    外部输入: 上述事实及本轮标识，不提交个人身份资料。
    外部输出: 一个有效风格标识、展示名与允许显示的解释；未知/不兼容返回按暂不可用处理，不猜映射。
    卡片展示目录:
      - 标识: observer
        名称: 洞察者
        语义: 留意别人忽略的线索与瞬间，从观察中读出可能。
      - 标识: breaker
        名称: 突围者
        语义: 面对变化敢于行动，继续迈向出现的出口。
      - 标识: planner
        名称: 策局者
        语义: 安静观察并联系可能，为远处机会作准备。
      - 标识: stealth
        名称: 潜行者
        语义: 注意细节、缝隙和时机，低调地争取空间。
    目录边界: 这些是原作四张卡的展示语义，不是分类规则；外部必须明确返回对应标识才显示，不能本地随机兜底。
    等待: 先完成故事回顾收藏，风格区域说明结果尚未取得并可重试；网络/服务不可用明确暂不可用。
    回顾: 按实际主线阶段短述合作、隐蔽劳动、二十年、调包、逃离、重逢；可显示小游戏辅助完成事实，不虚构操作成绩。
    收藏: 显示八项中的已发现数与实际内容，其中两项物证可检视；未发现只显示未知条目。已听日常独立列出，非必收任务。
    重播: 同轮卡与收藏快照保持，回放尝试不改原判定依据。
  来源:
    依据:
      - SRC_PACK
      - SRC_USER
    定位: U10；F11原卡语义
    设计引用:
      - D04
      - D05
验收:
  生成自检入口: 按配套规范第22节逐项检查；先语法和引用，再逐事件推演，不以字段齐全替代语义检查。
  覆盖映射:
    - 原编号: W01—W04
      本文件: 故事全貌、角色、物件、场景
    - 原编号: P01—P08、M01—M26
      本文件: 对应事件全保留，P07改为实操；M02/M05/M17接新退出与跳过规则
    - 原编号: G01—G03
      本文件: 玩法G01—G03；示例布局为标记的Agent设计
    - 原编号: E01
      本文件: R_OPTIONAL与V_EXPLORE_READY，不虚构一个必须完成的探索解锁任务
    - 原编号: E02—E07
      本文件: 同名事件，信息I_FINANCE至I_TAG与两件物证
    - 原编号: E08及E08a—j
      本文件: 十个独立日常事件及R_OPTIONAL
    - 原编号: E09及E09a—c
      本文件: 三个关键旁听事件、对应信息和收藏
    - 原编号: E10—E13
      本文件: 对应可选事件、K_HIDE和边界反馈
    - 原编号: F01—F12
      本文件: 同名事件；F02/F03共用G04、F07用G05；F11换为外部风格，F12不随机重抽
    - 原编号: R01—R09
      本文件: 规则、检查点、事件当前目标/提示；无独立任务注册表
    - 原编号: A01—A08
      本文件: 声音A01—A10，分别拆开雨雷与小游戏/结局功能
    - 原编号: 原分支及开发工具
      本文件: 项目明确排除，不要求补回
  必查关系:
    - 从空初值走完主线，不做任何可选事件也能到END01
    - 两种海报均能同样通过
    - 主线不得要求COL、可选事件或外部风格返回
    - 每个小游戏手动与加速都接同一剧情结果
    - 跳过不伪记实操教学
    - 原页与铜牌是仅有两件背包物证，口述不发原件
    - 二十年后老布及其闲聊关闭，无必做依赖
    - 书架固定局可四次交换解决
    - 迷宫跳过的图纸路线必须有效且不标成手动轨迹
    - 砸管窗口过期与窗外新按严格区别
    - 管道失败重置破口与爬行；保存继续与失败回退不同
    - 反复调包不复制账本，圣经在柜锤仍保留
    - F01前旧音乐和雨声全部停止
    - 随机查房不会与地图后的办公室主线叠加
    - 人物认知与玩家认知分别处理
    - 外部风格没有本地算法与随机兜底
  原作运行观察:
    - 方式: 正常输入观察
      覆盖: 菜单、客厅、前情局部；直接打开结局页后瑞德寻树两次调查到信；结局驾驶正常短距离移动。
      限制: 未从主游戏起点正常连续通关；直接开结局不证明主线可达。
    - 方式: 调试辅助观察
      覆盖: 15代表节点截图；书架实际错误交换失败、重试、成功回赠书；收音机实际输入成功回交锤；迷宫重置确认冻结、取消后超时。
      限制: 跳转不是正常前置路线证明；迷宫成功路线未完成运行验证。
    - 方式: 调试辅助观察
      覆盖: 驾驶调试移到出口后完成，推进重逢、原随机卡及重播；胜利到结局时读取到三路声音同时播放。
      限制: 非正常驾驶全程；播放状态不是人工试听。
    - 方式: 仅源码及资料确认
      覆盖: 其余剧情条件、可选探索、继续恢复、音频功能。
      限制: 未逐一正常运行所有组合，未完整人工试听。
  新设计验证: 当前只制作内容；小游戏退出快照、跳过、实操教学补充、外部风格及新保存规则均未实现为游戏或运行验证。
  文件检查:
    日期: '2026-10-30'
    范围:
      - 唯一键YAML解析
      - 全局ID唯一性与全部显式引用
      - 共同核心字段
      - Agent设计目标可定位
      - 两种海报、无可选事件的显式条件与物件顺序推演
      - 固定书架四次交换示例可解
      - 全部P/M/F及十组日常、三组旁听覆盖
      - Markdown相对链接
      - 与源码text字段至少12字符对白的整句重合扫描
    结果: 本轮检查通过；无重复键、重复ID、悬空引用或必填字段缺失。整句扫描未发现匹配，不代替全部语义审阅。
    限制: 现场距离与动作条件作为待游戏实现的前提，不属于静态推演实测。存档细节人工审阅；未模拟全部状态组合。
    原ZIP核对: SHA-256与原记录一致，未改动。
