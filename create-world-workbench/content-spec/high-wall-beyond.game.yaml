  - id: R_MOVE
    名称: 行动与输入隔离
    适用性: 适用
    规则: 自由行动摇杆/WASD；靠近对象交互键/空格；墙、家具、树干等阻挡。对话停步，长按释放即停；切场清除旧输入。主线关键交互优先，撒土优先于邻近闲聊。
    来源:
      依据:
        - SRC_PACK
        - SRC_USER
      定位: R01
      设计引用: []
  - id: R_TEXT
    名称: 短对白和演出
    适用性: 适用
    规则: 一份触发输入只做一件事；逐字叙述第一次补全、第二次继续。按语义段推进。短演出系统接管角色，不允许走开破坏步骤；必要等待只覆盖动作完成和基本听读。获得物件先反馈再继续，不用长演出代替内容。
    来源:
      依据:
        - SRC_PACK
        - SRC_USER
      定位: R02；U07
      设计引用:
        - D08
  - id: R_MAP
    名称: 庭院导航
    适用性: 适用
    规则: P08后仅庭院可用地图入口/M；打开冻结世界，关闭恢复，出院收起。实际行走揭雾，发现地标；已揭目标显示实际位置，未揭仅方向。标记门、办公室、图书馆、走廊入口、劳作区。移动NPC目标随实际位置。无传送，非排水图纸。
    来源:
      依据:
        - SRC_PACK
        - SRC_USER
      定位: R03
      设计引用: []
  - id: R_ITEM
    名称: 物件交互
    适用性: 适用
    规则: 按合法用途就近自动匹配，无额外装备前置；藏锤需明确拖放。检视仅登记页和铜牌，暂停现场；口述不变实物。贴墙海报和入柜圣经离开背包，工具不因藏书删除。
    来源:
      依据:
        - SRC_PACK
        - SRC_USER
      定位: R04
      设计引用: []
  - id: R_PAUSE
    名称: 暂停与覆盖层
    适用性: 适用
    规则: Esc主场景暂停；继续原地恢复。地图、物证和教学冻结相关世界。小游戏独立接管输入。办公室预警和藏身等待不能插入物证/闲聊；系统暂停仍冻结倒计时。恢复不残留长按。无综合设置页。
    来源:
      依据:
        - SRC_PACK
        - SRC_USER
      定位: R05
      设计引用:
        - D10
  - id: R_SAVE
    名称: 混合恢复
    适用性: 适用
    规则: 主线按CP节点记录；物件、时代、教学、海报、地图与完成事件必须一致。可选发现获得即保存。小游戏退出保存自身快照，继续优先恢复未完成局部，再回其入口事件。主场景未完成长按不逐帧恢复。新轮清空本轮记录；结局重播用独立回放状态。
    来源:
      依据:
        - SRC_PACK
        - SRC_USER
      定位: R06；U06
      设计引用:
        - D01
        - D08
  - id: R_FAIL
    名称: 失败边界
    适用性: 适用
    规则: 无效操作不算失败，失败面板说明原因和下一步，确认后恢复指定检查点。小游戏失败不重启全局；管道失败重置砸管和爬行并回海报。不存在没收、禁闭或另一结局。
    来源:
      依据:
        - SRC_PACK
        - SRC_USER
      定位: R07
      设计引用: []
  - id: R_WORLD
    名称: 阶段与人物
    适用性: 适用
    规则: 需要的NPC在可达处或从合理入口出现后走来，不能瞬移玩家或人物。对话暂停日常活动不改数值；恢复按现阶段。老布二十年后消失且不补领，必做都在此前完成。场景可立即响应、持续动态、重访显现年代变化。
    来源:
      依据:
        - SRC_PACK
        - SRC_USER
      定位: R09；U08
      设计引用:
        - D06
  - id: R_OPTIONAL
    名称: 探索窗口和调度
    适用性: 适用
    规则: M03与M05后探索谈话刷新设false；离开庭院再回来才设true。瑞德主线优先；老布邀请可接已开放线索再入馆，馆内线索讲完继续赠书。每份线索只首次发放。随机旁听若长期未出现，应在可用NPC空闲的下一次结对优先安排未听关键组，不强制玩家等候。
    来源:
      依据:
        - SRC_PACK
        - SRC_USER
      定位: E01/E08/E09
      设计引用:
        - D06
  - id: R_MINI
    名称: 独立小游戏共同操作
    适用性: 适用
    规则: G01至G05都有退出并保留、继续当前局、重新开始、加速完成。退出冻结局部计时/运动并回入口；结束主场景恢复。重开固定局面复原，随机局面生成新有效布局。跳过视为成功但保留发现和交付过程；只记跳过，不伪报手动，实操教学可豁免。
    来源:
      依据:
        - SRC_PACK
        - SRC_USER
      定位: U03/U05/U06
      设计引用:
        - D01
        - D02
        - D03
  - id: R_RESULTS
    名称: 回顾与风格
    适用性: 适用
    规则: 本轮游戏记录事实，外部系统决定风格。展示结局、主线回顾、已发现的八项可选内容及已听闲聊；两份物证可检视。外部结果未到显示等待，可重试或重播，不拦故事完成，不随机编造。重播不修改本轮风格依据。
    来源:
