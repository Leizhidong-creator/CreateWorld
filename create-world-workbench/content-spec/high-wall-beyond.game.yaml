# 依据同目录 Markdown 规范填写；全剧情剧透资料，不直接作为开场展示。
规范版本: '1.0'
项目:
  名称: 高墙之外
  体验目标: 以小规模互助、隐蔽劳动与二十年坚持走出高墙，在海边重逢中完成希望与自由的故事。
  理解模式: 操作推进为主，探索补充故事；不必收齐线索或理解全部阴谋才能通关。
  主线约束: 一条藏锤成功主线，一个第一结局；探索、海报外观、失败次数和小游戏完成方式均不分流剧情。
  受控角色:
    主体引用: C_ANDY
    例外:
      - 角色引用: C_RED
        事件引用:
          - F02
          - F03
          - F07
        原因: 用户明确保留第一结局寻树与驾驶两个小游戏；结局演出视角也跟随瑞德。
    观影片段: 不引入第二个可自由操控的观影者；白光后按安迪身份行动。
  固定内容:
    - 人物身份与关系
    - 黑墙庄园与幕后主使的称呼
    - 取得圣经藏锤成功主线
    - 二十年时间跨度
    - 石墙北端老橡树与信件的发现层次
    - 所有剧情编号、日期、单位名和对应关系
    - 先完成实际行动再获得剧情结果
    - 两种海报等价
    - 进入结局停止主音乐和水管雨声
  自由设计:
    - 剧情语义以内的全部自然对白与提示措辞
    - 像素画面构图、配色、角色形态和尺寸
    - 满足空间关系的具体路径与布局
    - 符合功能的音乐、音效、配音资源
    - 保持可解性及教学一致的难度和节奏
    - 明确缺失的细节由 Agent 完整设计并记录来源
  明确排除:
    - 没收石锤、禁闭、领导来访、取回锤的备用路线
    - 第二与第三结局及证据阈值
    - 开发调试面板
    - 新的密码锁、战斗、救人支线或隐藏首领
    - 游戏内风格评分和随机风格抽取
    - 前后端与内部代码结构要求
    - 原对白原句直接交付
  读取要求: 先读规范，再读本文件全貌、主线和初始配置，按引用合并档案与事件。来源定位不构成必须读取的外部依赖。
  来源:
    依据:
      - SRC_PACK
      - SRC_USER
    定位: 本次范围确认与全部已确认规范决定
    设计引用: []
故事全貌:
  - 观影者看到银行家安迪被陷害、囚于黑墙庄园的故事，遭电视异光卷入；安迪试图从大门逃离，却经历受束缚的手术室惊恐片段，醒来决定寻找瑞德、逃离并揭露这里。
  - 安迪修理瑞德的收音机换到石锤，再帮老布交换整理图书，得到私人圣经。他将锤藏入书中，通过搜房，向瑞德索要两种外观之一的海报遮住秘密洞口。
  - 安迪实际挖出一份泥土，带到庭院劳作区躲避巡查分次撒掉。回床后，用藏锤、夜挖、裤腿运土、庭院撒土四段蒙太奇表现同一方法坚持二十年。
  - 二十年后安迪与瑞德讨论排水图的风险，回房通过水管迷宫形成图纸。凭多年替幕后主使处理账务的关系进入办公室，等其离开，揭开刺绣后的保险柜，用圣经调换犯罪账本。
  - 安迪带着账本返回房间，经海报后的最终通道，在雨夜借雷电声音掩护凿管，进入破口，向正确出口爬行，获得自由。所收集证据不参与结局判定。
  - 瑞德循约到石墙北端老橡树，先注意黑曜石，再发现铁盒与安迪的信。信带来帮助和新生活邀约。他乘车出发，经过驾驶体验跨向边境，在墨西哥海滩恢复作为人的自我感，与安迪重逢。
  - 五位同伴的口述、两份物证、三类旁听及监管细节可串联付款、夜车和失踪，但只深化理解。完成后展示故事回顾、已发现内容和外部系统返回的本轮风格。
